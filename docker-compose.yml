services:
  neurodata-bi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neurodata-bi-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      # Persistent DuckDB database storage so datasets survive restarts
      - neurodata_storage:/app/backend/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  neurodata_storage:
    driver: local
